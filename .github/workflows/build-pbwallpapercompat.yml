name: build-pbwallpapercompat

on:
  workflow_dispatch:
  push:
    paths:
      - "PBWallpaperCompat/**"
      - ".github/workflows/build-pbwallpapercompat.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PBWallpaperCompat
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          brew install ldid make
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone https://github.com/theos/sdks.git "$HOME/theos/sdks"
      - name: Build package
        run: THEOS="$HOME/theos" gmake package FINALPACKAGE=1
      - name: Normalize RootHide architecture
        run: python3 rewrite_deb_architecture.py packages/*.deb iphoneos-arm64e
      - name: Verify package
        run: |
          test -n "$(find packages -name '*.deb' -print -quit)"
          shasum -a 256 packages/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: PBWallpaperCompat-rootless
          path: PBWallpaperCompat/packages/*.deb
      - name: Publish installable package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pbwallpapercompat-v2.1.0
          name: PBWallpaperCompat 2.1.0
          prerelease: true
          generate_release_notes: false
          files: PBWallpaperCompat/packages/*.deb
          fail_on_unmatched_files: true
