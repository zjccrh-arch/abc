name: build-pbwallpaper-hook-probe

on:
  workflow_dispatch:
  push:
    paths:
      - "PBWallpaperHookProbe/**"
      - ".github/workflows/build-pbwallpaper-hook-probe.yml"

jobs:
  package:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PBWallpaperHookProbe
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          brew install ldid make
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone https://github.com/theos/sdks.git "$HOME/theos/sdks"
      - name: Build package
        run: THEOS="$HOME/theos" gmake package FINALPACKAGE=1
      - name: Normalize RootHide architecture
        run: python3 ../PBWallpaperCompat/rewrite_deb_architecture.py packages/*.deb iphoneos-arm64e
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PBWallpaperHookProbe-rootless
          path: PBWallpaperHookProbe/packages/*.deb
